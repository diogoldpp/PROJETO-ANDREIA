<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
  <title id="t">Mapa ilustrativo da região da Arena da Baixada</title>
  <desc id="d">Ilustração de ruas do bairro Água Verde, em Curitiba, com um marcador vermelho indicando a Arena da Baixada.</desc>
  <rect width="800" height="500" fill="#eef0ea"/>

  
  <g fill="#e2e5dc">
    <rect x="20" y="20" width="170" height="110" rx="6"/>
    <rect x="230" y="20" width="170" height="110" rx="6"/>
    <rect x="440" y="20" width="150" height="110" rx="6"/>
    <rect x="630" y="20" width="150" height="110" rx="6"/>
    <rect x="20" y="170" width="170" height="120" rx="6"/>
    <rect x="630" y="170" width="150" height="120" rx="6"/>
    <rect x="20" y="330" width="170" height="150" rx="6"/>
    <rect x="230" y="330" width="170" height="150" rx="6"/>
    <rect x="440" y="330" width="150" height="150" rx="6"/>
    <rect x="630" y="330" width="150" height="150" rx="6"/>
  </g>

  
  <rect x="230" y="170" width="120" height="120" rx="10" fill="#cfe3c2"/>
  <circle cx="290" cy="230" r="26" fill="#b8d6a6"/>

  
  <path d="M0 305 C 120 285, 200 330, 330 312 S 560 282, 800 310" fill="none" stroke="#bcd8ea" stroke-width="16" stroke-linecap="round"/>

  
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <line x1="0" y1="150" x2="800" y2="150" stroke-width="22"/>
    <line x1="210" y1="0" x2="210" y2="500" stroke-width="18"/>
    <line x1="610" y1="0" x2="610" y2="500" stroke-width="18"/>
    <line x1="0" y1="310" x2="800" y2="310" stroke-width="0"/>
  </g>
  
  <g stroke="#ffffff" stroke-linecap="round" fill="none" stroke-width="10">
    <line x1="0" y1="310" x2="800" y2="310" stroke-width="0"/>
    <line x1="420" y1="0" x2="420" y2="500"/>
    <line x1="0" y1="55" x2="800" y2="55" stroke-width="8"/>
    <line x1="0" y1="470" x2="800" y2="470" stroke-width="8"/>
  </g>
  
  <line x1="0" y1="250" x2="800" y2="250" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  <line x1="0" y1="250" x2="800" y2="250" stroke="#f3d9de" stroke-width="2" stroke-dasharray="14 10"/>

  
  <ellipse cx="500" cy="210" rx="78" ry="46" fill="#c8102e" opacity="0.14"/>
  <ellipse cx="500" cy="210" rx="62" ry="34" fill="#ffffff" stroke="#c8102e" stroke-width="5"/>
  <ellipse cx="500" cy="210" rx="38" ry="18" fill="#9fcf8a" stroke="#c8102e" stroke-width="2"/>

  
  <g transform="translate(500 160)">
    <path d="M0 0 C -26 -34, -26 -76, 0 -76 C 26 -76, 26 -34, 0 0 Z" fill="#c8102e" stroke="#ffffff" stroke-width="3"/>
    <circle cx="0" cy="-52" r="9" fill="#ffffff"/>
  </g>

  
  <g font-family="Arial, sans-serif" fill="#555">
    <text x="640" y="243" font-size="14" font-weight="bold" fill="#c8102e">R. Buenos Aires</text>
    <text x="620" y="140" font-size="13" transform="rotate(0)">Av. Sete de Setembro</text>
    <text x="30" y="145" font-size="13">Av. Getúlio Vargas</text>
    <text x="240" y="232" font-size="12" fill="#5d7f4c">Praça</text>
    <text x="40" y="410" font-size="16" font-weight="bold" fill="#8a8f80" letter-spacing="2">ÁGUA VERDE</text>
    <text x="440" y="116" font-size="16" font-weight="bold" fill="#8a8f80" letter-spacing="2">CURITIBA</text>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="440" y="276" width="120" height="26" rx="13" fill="#c8102e"/>
    <text x="500" y="294" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Arena da Baixada</text>
  </g>
</svg>
